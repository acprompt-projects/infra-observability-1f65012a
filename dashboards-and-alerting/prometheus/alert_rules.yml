===
groups:
  - name: red-critical
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (job)
            /
          sum(rate(http_requests_total[5m])) by (job)
            > 0.05
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: >-
            {{ $labels.job }} is returning 5xx errors at
            {{ $value | printf "%.2f" }}% of traffic (threshold 5%)
            for the last 5 minutes.

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (job, le)
          ) > 1.0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "P99 latency above 1s on {{ $labels.job }}"
          description: >-
            {{ $labels.job }} P99 latency is
            {{ $value | printf "%.2f" }}s (threshold 1s).

      - alert: ElevatedLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (job, le)
          ) > 2.0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "P99 latency above 2s on {{ $labels.job }}"
          description: >-
            {{ $labels.job }} P99 latency is
            {{ $value | printf "%.2f" }}s (threshold 2s).

  - name: use-critical
    rules:
      - alert: HighCPUUtilization
        expr: |
          sum(rate(process_cpu_seconds_total[5m])) by (job) * 100 > 90
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "CPU utilization above 90% on {{ $labels.job }}"
          description: >-
            {{ $labels.job }} CPU utilization is
            {{ $value | printf "%.1f" }}% (threshold 90%).

      - alert: MemorySaturation
        expr: |
          process_resident_memory_bytes / process_memory_limit_bytes > 0.90
        for: 10m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Memory saturation above 90% on {{ $labels.job }}"
          description: >-
            {{ $labels.job }} memory usage is at
            {{ $value | printf "%.1f" }}% of limit (threshold 90%).

      - alert: DiskIOSaturation
        expr: |
          rate(node_disk_io_time_seconds_total[5m]) > 0.9
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Disk I/O saturation on {{ $labels.device }}"
          description: >-
            Device {{ $labels.device }} I/O saturation is
            {{ $value | printf "%.2f" }}s/s (threshold 0.9s/s).

      - alert: FilesystemSpaceLow
        expr: |
          (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.10
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} below 10% free"
          description: >-
            Mount {{ $labels.mountpoint }} on {{ $labels.instance }} has
            {{ $value | printf "%.1f" }}% remaining (threshold 10%).

  - name: availability
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 3m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: >-
            {{ $labels.instance }} (job={{ $labels.job }}) has been
            unreachable for 3 minutes.

      - alert: HighLogErrorRate
        expr: |
          sum(count_over_time({job=~".+"} |~ "(?i)error|exception|fatal" [5m])) by (job) > 50
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High error log volume on {{ $labels.job }}"
          description: >-
            {{ $labels.job }} produced {{ $value }} error-level log entries
            in the last 5 minutes (threshold 50).